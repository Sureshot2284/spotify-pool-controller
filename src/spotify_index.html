<HTML>
    <HEAD>
        <TITLE>Music Controller Login</TITLE>
        <STYLE>
            @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;900&display=swap');

            input {
                caret-color: red;
            }

            body {
                margin: 0;
                width: 100vw;
                height: 100vh;
                background: #202020;
                display: flex;
                align-items: center;
                text-align: center;
                justify-content: center;
                place-items: center;
                overflow: hidden;
                font-family: poppins;
            }

            .container {
                position: relative;
                width: 350px;
                height: 500px;
                border-radius: 20px;
                padding: 40px;
                box-sizing: border-box;
                background: #273729;
                box-shadow: 14px 14px 20px #0d0f0c, -14px -14px 20px #121a13;
            }

            .brand-logo {
                height: 100px;
                width: 100px;
                background: url("https://img.icons8.com/color/100/000000/spotify--v2.png");
                margin: auto;
                border-radius: 50%;
                box-sizing: border-box;
                box-shadow: 7px 7px 10px #172217, -7px -7px 10px #1d2617;
            }

            .brand-title {
                margin-top: 10px;
                font-weight: 900;
                font-size: 1.8rem;
                color: #1DB954;
                letter-spacing: 1px;
            }

            .inputs {
                text-align: left;
                margin-top: 30px;
            }

            label, input, button {
                display: block;
                width: 100%;
                padding: 0;
                border: none;
                outline: none;
                box-sizing: border-box;
            }

            label {
                margin-bottom: 4px;
            }

            label:nth-of-type(2) {
                margin-top: 12px;
            }

            input::placeholder {
                color: gray;
            }

            input {
                background: #ecf0f3;
                padding: 10px;
                padding-left: 20px;
                height: 50px;
                font-size: 14px;
                border-radius: 50px;
                box-shadow: inset 6px 6px 6px #cbced1, inset -6px -6px 6px white;
            }

            button {
                color: white;
                margin-top: 20px;
                background: #1DB954;
                height: 40px;
                border-radius: 20px;
                cursor: pointer;
                font-weight: 900;
                box-shadow: 6px 6px 6px #0a150c, -6px -6px 6px #3c3b3b;
                transition: 0.5s;
            }

            button:hover {
                box-shadow: none;
            }

            a {
                    position: absolute;
                font-size: 8px;
                bottom: 4px;
                right: 4px;
                text-decoration: none;
                color: black;
                background: yellow;
                border-radius: 10px;
                padding: 2px;
            }

            h1 {
                position: absolute;
                top: 0;
                left: 0;
            }
        </STYLE>
    </HEAD>
    <BODY>
        <div class="container">
            <div class="brand-logo"></div>
            <div class="brand-title">SPOTIFY</div>
            <div class="inputs">
                <form action="http://music-controller.local/get_data">
                    <input name="response_type" type="hidden" value="code">
                    <label for="client_id">Client ID:</label><br>
                    <input type="text" name="client_id" id="client_id" required><br>
                    <label for="client_secret">Client SECRET:</label><br>
                    <input type="text" name="client_secret" id="client_secret" required><br>
                    <input name="redirect_uri" type="hidden" value="http://music-controller.local/callback">
                    <input name="scope" type="hidden" value="streaming user-modify-playback-state user-read-currently-playing user-read-playback-state user-library-modify user-library-read">
                    <button type="submit" value="Submit">Log In</button>
                </form>
            </div>
        </div>
    </BODY>
</HTML>
