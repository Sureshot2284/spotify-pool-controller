<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Connecting Spotify</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #121212;
      color: #fff;
    }

    main {
      width: min(88vw, 420px);
      padding: 2rem;
      border-radius: 18px;
      background: #1e1e1e;
      box-shadow: 0 18px 60px rgb(0 0 0 / 35%);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 1.6rem;
    }

    p {
      line-height: 1.5;
      color: #d8d8d8;
    }

    a {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.8rem 1.15rem;
      border-radius: 999px;
      background: #1ed760;
      color: #081b0f;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Connecting Spotify…</h1>
    <p id="message">Sending you back to the poolside controller.</p>
    <a id="continue" hidden>Continue to controller</a>
  </main>

  <script>
    (() => {
      const spotifyResponse = new URLSearchParams(window.location.search);
      const forwarded = new URLSearchParams();

      for (const key of ["code", "state", "error", "error_description"]) {
        if (spotifyResponse.has(key)) {
          forwarded.set(key, spotifyResponse.get(key));
        }
      }

      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const continueLink = document.getElementById("continue");

      if (!forwarded.has("code") && !forwarded.has("error")) {
        title.textContent = "No Spotify response found";
        message.textContent = "Start the Spotify connection from your poolside controller and try again.";
        return;
      }

      const controllerUrl = `http://music-controller.local/callback?${forwarded.toString()}`;
      continueLink.href = controllerUrl;
      continueLink.hidden = false;

      window.setTimeout(() => {
        window.location.replace(controllerUrl);
      }, 800);
    })();
  </script>
</body>
</html>
